<!-- $any(): Optimus UI types `pattern`/`min`/`max` inputs incompatibly with Signal Forms (openng-org/optimus-ui#155) -->
<div class="configuration-regex-map">
  <div>
    <p-list-box
      [options]="elementNames()"
      scrollHeight="100%"
      [(ngModel)]="selectedName"
      [dragdrop]="!readonly()"
    ></p-list-box>
  </div>
  <div>
    @if (selectedForm(); as form) {
      <div class="fluid-form">
        <div class="fluid-form-element">
          <label [for]="name">{{ 'label.name' | transloco }}</label>
          <input #name pInputText [formField]="form.name" />
        </div>
        <div class="fluid-form-element">
          <label [for]="description">{{ 'label.description' | transloco }}</label>
          <input #description pInputText [formField]="form.description" />
        </div>
        <div class="fluid-form-element">
          <label [for]="mapTo">{{ 'configuration.regexMap.mapTo' | transloco }}</label>
          <input #mapTo pInputText [formField]="form.mapTo" />
        </div>
        <div class="fluid-form-element">
          <label [for]="keywords">{{ 'configuration.regexMap.keywords' | transloco }}</label>
          <p-auto-complete
            #keywords
            [formField]="$any(form.keywords)"
            inputId="multiple-ac-2"
            multiple
            fluid
            [typeahead]="false"
          />
        </div>
        <div class="fluid-form-element">
          <label [for]="limitToDataSource">{{ 'configuration.regexMap.limitToDataSource' | transloco }}</label>
          <p-auto-complete
            #limitToDataSource
            [formField]="$any(form.limitToDataSource)"
            inputId="multiple-ac-2"
            multiple
            fluid
            [typeahead]="false"
          />
        </div>
      </div>
    }
  </div>
</div>
