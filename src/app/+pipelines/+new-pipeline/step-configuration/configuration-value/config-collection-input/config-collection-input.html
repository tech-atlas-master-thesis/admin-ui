<div class="config-collection-input">
  <app-lazy-configuration [formField]="configForm.configuration" [style]="{ width: '100%' }"></app-lazy-configuration>
  @if (configForm.configuration().value()) {
    <app-lazy-configuration-version
      [formField]="configForm.version"
      [configId]="configForm.configuration().value()?.id"
      [style]="{ width: '100%' }"
      [placeholder]="'newPipeline.config.latest' | transloco"
      [showClear]="true"
    ></app-lazy-configuration-version>
  }
</div>
